<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - Arch1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a th:href="@{/}" class="text-2xl font-bold text-blue-600">Arch1</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/}" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">홈</a>
                    <a th:href="@{/about}" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">About</a>
                    <a th:href="@{/dashboard}" class="text-blue-600 px-3 py-2 rounded-md text-sm font-medium">대시보드</a>
                    <a th:href="@{/posts}" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">게시판</a>
                    <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">로그아웃</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        <!-- Welcome Section -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">대시보드</h1>
            <p class="mt-2 text-gray-600">안녕하세요, <span th:text="${currentUser.fullName}">사용자</span>님!</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-blue-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">내 게시글</dt>
                                <dd class="text-lg font-medium text-gray-900" th:text="${userPostCount}">0</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-green-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">전체 사용자</dt>
                                <dd class="text-lg font-medium text-gray-900" th:text="${totalUsers}">0</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 bg-purple-500 rounded-md flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">관리자</dt>
                                <dd class="text-lg font-medium text-gray-900" th:text="${adminCount}">0</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Posts -->
        <div class="bg-white shadow rounded-lg mb-8">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">최근 게시글</h3>
                <div class="space-y-4">
                    <div th:each="post : ${recentPosts}" class="border-b border-gray-200 pb-4 last:border-b-0">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <h4 class="text-sm font-medium text-gray-900">
                                    <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}" class="hover:text-blue-600"></a>
                                </h4>
                                <p class="text-sm text-gray-500 mt-1" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</p>
                            </div>
                            <div class="text-sm text-gray-500" th:text="${post.viewCount} + ' 조회'">0 조회</div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(recentPosts)}" class="text-center text-gray-500 py-4">
                        아직 게시글이 없습니다.
                    </div>
                </div>
            </div>
        </div>

        <!-- Popular Posts -->
        <div class="bg-white shadow rounded-lg">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">인기 게시글</h3>
                <div class="space-y-4">
                    <div th:each="post : ${popularPosts}" class="border-b border-gray-200 pb-4 last:border-b-0">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <h4 class="text-sm font-medium text-gray-900">
                                    <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}" class="hover:text-blue-600"></a>
                                </h4>
                                <p class="text-sm text-gray-500 mt-1" th:text="${post.author.fullName} + ' • ' + ${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">작성자 • 2024-01-01</p>
                            </div>
                            <div class="text-sm text-gray-500" th:text="${post.viewCount} + ' 조회'">0 조회</div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(popularPosts)}" class="text-center text-gray-500 py-4">
                        아직 게시글이 없습니다.
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-8 flex space-x-4">
            <a th:href="@{/posts/create}" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700">
                새 게시글 작성
            </a>
            <a th:href="@{/posts}" class="bg-gray-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-700">
                게시판 보기
            </a>
        </div>
    </div>
</body>
</html>
